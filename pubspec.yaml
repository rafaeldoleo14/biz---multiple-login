name: biz_codigo_cash
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.0-97.0.dev

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_svg: ^2.1.0
  go_router: ^15.1.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  loading_animation_widget: ^1.3.0
  progress_bar_countdown: ^0.0.3
  provider: ^6.1.5

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  intl: ^0.20.2
  local_auth: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/background/
    - assets/icons/
    - assets/logo/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: SF
      fonts:
        # ---------- SF Pro Text ----------
        - asset: fonts/SF/SF-Pro-Text-Ultralight.otf
          weight: 200
        - asset: fonts/SF/SF-Pro-Text-Thin.otf
          weight: 100
        - asset: fonts/SF/SF-Pro-Text-Light.otf
          weight: 300
        - asset: fonts/SF/SF-Pro-Text-Regular.otf
          weight: 400
        - asset: fonts/SF/SF-Pro-Text-Medium.otf
          weight: 500
        - asset: fonts/SF/SF-Pro-Text-Semibold.otf
          weight: 600
        - asset: fonts/SF/SF-Pro-Text-Bold.otf
          weight: 700
        - asset: fonts/SF/SF-Pro-Text-Heavy.otf
          weight: 800

        # Italic (Text)
        - asset: fonts/SF/SF-Pro-Text-UltralightItalic.otf
          weight: 200
          style: italic
        - asset: fonts/SF/SF-Pro-Text-ThinItalic.otf
          weight: 100
          style: italic
        - asset: fonts/SF/SF-Pro-Text-LightItalic.otf
          weight: 300
          style: italic
        - asset: fonts/SF/SF-Pro-Text-RegularItalic.otf
          weight: 400
          style: italic
        - asset: fonts/SF/SF-Pro-Text-MediumItalic.otf
          weight: 500
          style: italic
        - asset: fonts/SF/SF-Pro-Text-SemiboldItalic.otf
          weight: 600
          style: italic
        - asset: fonts/SF/SF-Pro-Text-BoldItalic.otf
          weight: 700
          style: italic
        - asset: fonts/SF/SF-Pro-Text-HeavyItalic.otf
          weight: 800
          style: italic

        # ---------- SF Pro Display ----------
        - asset: fonts/SF/SF-Pro-Display-Ultralight.otf
          weight: 200
        - asset: fonts/SF/SF-Pro-Display-Thin.otf
          weight: 100
        - asset: fonts/SF/SF-Pro-Display-Light.otf
          weight: 300
        - asset: fonts/SF/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: fonts/SF/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: fonts/SF/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: fonts/SF/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: fonts/SF/SF-Pro-Display-Heavy.otf
          weight: 800
        - asset: fonts/SF/SF-Pro-Display-Black.otf
          weight: 900

        # Italic (Display)
        - asset: fonts/SF/SF-Pro-Display-UltralightItalic.otf
          weight: 200
          style: italic
        - asset: fonts/SF/SF-Pro-Display-ThinItalic.otf
          weight: 100
          style: italic
        - asset: fonts/SF/SF-Pro-Display-LightItalic.otf
          weight: 300
          style: italic
        - asset: fonts/SF/SF-Pro-Display-RegularItalic.otf
          weight: 400
          style: italic
        - asset: fonts/SF/SF-Pro-Display-MediumItalic.otf
          weight: 500
          style: italic
        - asset: fonts/SF/SF-Pro-Display-SemiboldItalic.otf
          weight: 600
          style: italic
        - asset: fonts/SF/SF-Pro-Display-BoldItalic.otf
          weight: 700
          style: italic
        - asset: fonts/SF/SF-Pro-Display-HeavyItalic.otf
          weight: 800
          style: italic
        - asset: fonts/SF/SF-Pro-Display-BlackItalic.otf
          weight: 900
          style: italic

        # ---------- SF Pro Rounded (si la usas) ----------
        - asset: fonts/SF/SF-Pro-Rounded-Ultralight.otf
          weight: 200
        - asset: fonts/SF/SF-Pro-Rounded-Thin.otf
          weight: 100
        - asset: fonts/SF/SF-Pro-Rounded-Light.otf
          weight: 300
        - asset: fonts/SF/SF-Pro-Rounded-Regular.otf
          weight: 400
        - asset: fonts/SF/SF-Pro-Rounded-Medium.otf
          weight: 500
        - asset: fonts/SF/SF-Pro-Rounded-Semibold.otf
          weight: 600
        - asset: fonts/SF/SF-Pro-Rounded-Bold.otf
          weight: 700
        - asset: fonts/SF/SF-Pro-Rounded-Heavy.otf
          weight: 800
        - asset: fonts/SF/SF-Pro-Rounded-Black.otf
          weight: 900
    - family: Neo Sans Std
      fonts:
        - asset: fonts/Neo Sans Std Regular.otf
        - asset: fonts/Neo Sans Std Light.otf
        - asset: fonts/Neo Sans Std Medium.otf
        - asset: fonts/Neo Sans Std Bold.otf
    #         style: italic
    - family: Gotham
      fonts:
        - asset: fonts/GothamLight.ttf
        - asset: fonts/Gotham Regular.ttf
        - asset: fonts/GothamMedium.ttf
        - asset: fonts/GothamBold.ttf
    #         weight: 700
    - family: Helvetica
      fonts:
        - asset: fonts/Helvetica.ttf
        - asset: fonts/Helvetica-Bold.ttf
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
